name: Main CICD Workflow

on:
  push:
    branches: [ '**' ]
  schedule:
    - cron:  '30 7 * * *'
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'thelaluka' }}

jobs:
  docker:
    if: github.repository == 'laluka/SkillArch'
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-* aspnetcore-* mono-* libmono-* php*-* r-base-core snapd"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/share/dotnet /usr/share/kotlinc /usr/share/gradle* /usr/share/sbt /usr/share/ri /opt/hostedtoolcache /imagegeneration"
          testing: false

      - name: Extra Disk Cleanup
        run: |
          sudo docker system prune -af || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build and smoke-test lite and full
        run: make docker-build-full

      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested images
        if: github.ref == 'refs/heads/main'
        run: |
          image="$DOCKERHUB_USERNAME/skillarch"
          for variant in lite full; do
            docker tag "thelaluka/skillarch:$variant" "$image:$variant"
            docker tag "$image:$variant" "$image:$variant-$GITHUB_SHA"
            docker push "$image:$variant-$GITHUB_SHA"
            docker push "$image:$variant"
          done
          docker tag "$image:full" "$image:latest"
          docker push "$image:latest"

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - run: |
          semgrep ci
        env:
          # Generate a token from Semgrep AppSec Platform > Setting
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}


  trivy:
    if: github.repository == 'laluka/SkillArch'
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy in fs mode
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'misconfig,secret'
      - name: Run Trivy in image mode
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: '${{ env.DOCKERHUB_USERNAME }}/skillarch:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          scanners: 'secret'
          timeout: '30m'
          skip-dirs: '/opt/lists,/opt/ghidra,/opt/metasploit,/opt/exploitdb,/home/hacker/.rustup/toolchains,/home/hacker/.local/go,/opt/phpggc,/opt/pypotomux/wordlists,/usr/NX/etc/keys,/usr/NX/share/keys,/home/hacker/.nuclei-templates,/home/hacker/.local/share/mise/installs/go,/home/hacker/.cache/mise,/home/hacker/.fzf,/usr/lib/qt/mkspecs,/usr/lib/qt6/mkspecs,/home/hacker/.cache/uv/archive-v0' # Chunky boys

  gitleaks:
    if: github.repository == 'laluka/SkillArch'
    name: gitleaks
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          git config --global --add safe.directory /__w/skillarch/skillarch
          gitleaks detect --source . --redact -v --exit-code=2 --report-format=sarif --report-path=results.sarif --log-level=debug
