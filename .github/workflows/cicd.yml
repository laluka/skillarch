name: Main CICD Workflow

permissions:
  contents: read

on:
  push:
    branches: [ '**' ]
  schedule:
    - cron:  '30 7 * * *'
  pull_request:
    branches: [ main ]

jobs:
  docker:
    if: github.repository == 'laluka/SkillArch'
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@24d3e2af1fe79ccdde8844605337a8835e20d012 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-* aspnetcore-* mono-* libmono-* php*-* r-base-core snapd"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/share/dotnet /usr/share/kotlinc /usr/share/gradle* /usr/share/sbt /usr/share/ri /opt/hostedtoolcache /imagegeneration"
          testing: false

      - name: Extra Disk Cleanup
        run: |
          sudo docker system prune -af || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke-test lite and full
        run: make docker-build-full

      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: thelaluka
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested images
        if: github.ref == 'refs/heads/main'
        run: |
          image="thelaluka/skillarch"
          for variant in lite full; do
            docker tag "$image:$variant" "$image:$variant-$GITHUB_SHA"
            docker push "$image:$variant-$GITHUB_SHA"
            docker push "$image:$variant"
          done
          docker tag "$image:full" "$image:latest"
          docker push "$image:latest"

  opengrep:
    name: opengrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Opengrep
        run: |
          curl -fsSL -o opengrep https://github.com/opengrep/opengrep/releases/download/v2.0.0/opengrep_linux_x86
          echo '37e93f4da5fd04a18c5c1febbdd12f7e98dfccd4d0c9cf2593bcb25eeb462da0  opengrep' | sha256sum -c -
          chmod +x opengrep
      - name: Scan with local rules
        run: ./opengrep ci --config .github/opengrep-rules.yml --no-suppress-errors


  trivy-fs:
    if: github.repository == 'laluka/SkillArch'
    name: trivy-fs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Trivy in fs mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.2'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'misconfig,secret'

  trivy-image:
    if: github.repository == 'laluka/SkillArch' && github.ref == 'refs/heads/main'
    name: trivy-image
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report full-image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.2'
          image-ref: 'thelaluka/skillarch:full-${{ github.sha }}'
          format: 'json'
          output: 'trivy-image.json'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          timeout: '60m'
          skip-dirs: '/opt/lists,/opt/ghidra,/opt/metasploit,/opt/exploitdb,/home/hacker/.rustup/toolchains,/home/hacker/.local/go,/opt/phpggc,/opt/pypotomux/wordlists,/usr/NX/etc/keys,/usr/NX/share/keys,/home/hacker/.nuclei-templates,/home/hacker/.local/share/mise/installs/go,/home/hacker/.cache/mise,/home/hacker/.fzf,/usr/lib/qt/mkspecs,/usr/lib/qt6/mkspecs,/home/hacker/.cache/uv/archive-v0' # Chunky boys
      - name: Summarize unique findings
        run: python3 .github/scripts/summarize_trivy.py trivy-image.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload full Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-full-image-${{ github.sha }}
          path: trivy-image.json
          if-no-files-found: warn
          retention-days: 14

  betterleaks:
    if: github.repository == 'laluka/SkillArch'
    name: betterleaks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/betterleaks/betterleaks:v1.10.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Betterleaks
        run: |
          betterleaks git . --redact --exit-code=2 --report-format=sarif --report-path=results.sarif
